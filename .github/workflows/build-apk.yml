name: Build Macro Touch Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Check for Gradle wrapper
        id: check-wrapper
        run: |
          echo "Checking gradle/wrapper/gradle-wrapper.jar..."
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "wrapper_present=true" >> $GITHUB_OUTPUT
          else
            echo "wrapper_present=false" >> $GITHUB_OUTPUT
          fi

      - name: Build with Gradle Wrapper
        if: steps.check-wrapper.outputs.wrapper_present == 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build with Gradle CLI (fallback)
        if: steps.check-wrapper.outputs.wrapper_present == 'false'
        uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroTouchPro-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
